services:
  - type: web
    name: student-management-backend
    env: node
    plan: free
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.x
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: "*"
